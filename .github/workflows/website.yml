name: Website

on:
  workflow_dispatch:
  push:
    paths:
      - Website/**
      - Resources/Lessons.json
      - Resources/Assets.xcassets/**
      - Resources/Fonts/**
      - Views/SourcesView.swift
  pull_request:
    paths:
      - Website/**
      - Resources/Lessons.json
      - Resources/Assets.xcassets/**
      - Resources/Fonts/**
      - Views/SourcesView.swift

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
      - run: npm run verify
